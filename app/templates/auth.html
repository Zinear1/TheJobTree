{% extends "base.html" %}
{% block title %}TheJobTree — Вход и регистрация{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card animate-card">
        <div class="auth-tabs">
            <a href="{{ url_for('login') }}" class="tab-btn {% if active_tab == 'login' %}active{% endif %}">Вход</a>
            <a href="{{ url_for('register') }}" class="tab-btn {% if active_tab == 'register' %}active{% endif %}">Регистрация</a>
        </div>

        {% if active_tab == 'login' %}
            <form method="POST" action="{{ url_for('login') }}" class="form-grid">
                <label>
                    <span>Email</span>
                    <input type="email" name="email" required placeholder="volodya@thejobtree.ru">
                </label>
                <label>
                    <span>Пароль</span>
                    <input type="password" name="password" required placeholder="Введите пароль">
                </label>
                <button type="submit" class="btn btn-primary btn-full">Войти в аккаунт</button>
            </form>

            <div class="demo-hint">
                <strong>Демо-вход:</strong> <code>volodya@thejobtree.ru</code> или <code>igor.petrov@mail.ru</code>, пароль: <code>123456</code>
            </div>

            <!-- Блок входа для администратора БД -->
            <div class="admin-login-block">
                <button type="button" id="admin-toggle-btn" class="btn btn-ghost btn-full admin-toggle-btn">
                    <svg class="btn-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Вход для админа</span>
                </button>

                <form method="POST" action="{{ url_for('admin_login') }}"
                      id="admin-login-form"
                      class="form-grid admin-password-box {% if not request.args.get('admin') %}hidden{% endif %}">
                    <label>
                        <span>Пароль администратора</span>
                        <input type="password" name="admin_password" id="admin-password-input"
                               required placeholder="Введите пароль админа">
                    </label>
                    <button type="submit" class="btn btn-accent btn-full">Открыть управление БД</button>
                </form>
            </div>
        {% else %}
            <form method="POST" action="{{ url_for('register') }}" class="form-grid">
                <div class="form-row">
                    <label>
                        <span>Имя</span>
                        <input type="text" name="first_name" required placeholder="Иван">
                    </label>
                    <label>
                        <span>Фамилия</span>
                        <input type="text" name="last_name" required placeholder="Иванов">
                    </label>
                </div>
                <label>
                    <span>Email</span>
                    <input type="email" name="email" required placeholder="ivan@example.com">
                </label>
                <div class="form-row">
                    <label>
                        <span>Телефон</span>
                        <input type="text" name="phone" required placeholder="+79101234567">
                    </label>
                    <label>
                        <span>Город</span>
                        <select name="city" required>
                            {% for c in g.available_cities %}
                                <option value="{{ c }}" {% if c == g.selected_city %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </label>
                </div>
                <label>
                    <span>Пароль</span>
                    <input type="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
                </label>
                <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
            </form>
        {% endif %}
    </div>
</div>

<script>
(function () {
    const toggleBtn = document.getElementById('admin-toggle-btn');
    const adminForm = document.getElementById('admin-login-form');
    const pwdInput = document.getElementById('admin-password-input');
    if (toggleBtn && adminForm) {
        toggleBtn.addEventListener('click', () => {
            const isHidden = adminForm.classList.toggle('hidden');
            if (!isHidden && pwdInput) {
                pwdInput.focus();
            }
        });
    }
})();
</script>
{% endblock %}
